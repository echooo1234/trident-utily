name: Build Trident Util

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # gradlew projede yok, bu yüzden Gradle'ı doğrudan kuruyoruz
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: gradle build --stacktrace --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tridentutil
          path: build/libs/*.jar
